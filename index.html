    <style>
        @font-face {
            font-family: 'Spiderman';
            src: url('Spiderman.woff2') format('woff2'),

        body {

        }

        .spiderman-text {
            font-family: 'Spiderman', sans-serif;

            color: #e22d25; 
            text-shadow: 3px 3px 0px #000000;
        }

        h2.spiderman-text {
            font-size: 2.5rem; 
        }

        button {
            display: block;
            margin: 30px auto;
            height: 80px;
            width: 120px; 
            border-radius: 12px;
            background-color: #001f3f; 
            border: 2px solid #e22d25;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1); 
        }

        button a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
    </style>
